name: CI

on:
  push:
    branches: [develop, develop-stellar, main]
  pull_request:
    branches: [develop, develop-stellar, main]

jobs:
  lint-typecheck:
    name: Lint & Typecheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'pnpm'
      - run: pnpm install --frozen-lockfile
      - run: pnpm -w lint
      - run: pnpm -w typecheck

  test:
    name: Unit Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'pnpm'
      - run: pnpm install --frozen-lockfile
      - run: pnpm -w test

  build:
    name: Build
    runs-on: ubuntu-latest
    needs: [lint-typecheck, test]
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'pnpm'
      - run: pnpm install --frozen-lockfile
      - run: cp apps/web/.env.ci apps/web/.env
      - run: pnpm -w build

  audit:
    name: Security Audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'pnpm'
      - run: pnpm install --frozen-lockfile
      - run: pnpm audit --prod --audit-level high
        # Fails on high/critical vulnerabilities only

  contracts-test:
    name: Forge Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - name: Install Foundry
        uses: foundry-rs/foundry-toolchain@v1
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
      - name: Run forge test with gas report
        run: |
          cd contracts
          forge test --gas-report

  contracts-slither:
    name: Slither Static Analysis
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - name: Install Foundry
        uses: foundry-rs/foundry-toolchain@v1
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
      - name: Install Slither
        run: pip install slither-analyzer
      - name: Run Slither
        run: slither contracts/ --config-file contracts/slither.config.json
        continue-on-error: true  # TODO: remove once findings are triaged

  contracts-gen-abis:
    name: Generate ABIs
    runs-on: ubuntu-latest
    needs: [contracts-test]
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - name: Install Foundry
        uses: foundry-rs/foundry-toolchain@v1
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'pnpm'
      - run: pnpm install --frozen-lockfile
      - name: Generate ABIs
        run: pnpm gen:abis
      - name: Check no uncommitted ABI changes
        run: git diff --exit-code packages/shared/src/abis/ || (echo "ABIs are out of date — run pnpm gen:abis and commit" && exit 1)

  soroban-test:
    name: Soroban Contract Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: contracts-stellar
      - name: Run cargo test
        run: |
          cd contracts-stellar
          cargo test

  soroban-build:
    name: Soroban WASM Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: contracts-stellar
      - name: Build WASM
        run: |
          cd contracts-stellar
          cargo build --target wasm32-unknown-unknown --release

  soroban-gen-bindings:
    name: Generate Soroban Bindings
    runs-on: ubuntu-latest
    needs: [soroban-build]
    steps:
      - uses: actions/checkout@v4
      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: contracts-stellar
      - name: Install Stellar CLI
        run: cargo install stellar-cli --locked --no-default-features
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'pnpm'
      - run: pnpm install --frozen-lockfile
      - name: Build WASM
        run: pnpm build:contracts
      - name: Generate bindings
        run: pnpm gen:soroban
      - name: Check no uncommitted binding changes
        run: git diff --exit-code packages/shared/src/soroban/ || (echo "Soroban bindings are out of date — run pnpm gen:soroban and commit" && exit 1)
