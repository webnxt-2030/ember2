[profile.default]
src = "src"
out = "out"
libs = ["lib"]
solc = "0.8.28"
optimizer = true
optimizer_runs = 200
ffi = false
# Slither / coverage
via_ir = false

[profile.default.fuzz]
runs = 256

[profile.default.invariant]
runs = 256

[etherscan]
morph = { key = "${MORPH_EXPLORER_API_KEY}", url = "https://explorer.morphl2.io/api", chain = 2818 }
morph-hoodi = { key = "${MORPH_EXPLORER_API_KEY}", url = "https://explorer-holesky.morphl2.io/api", chain = 2810 }
